<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="rosa"><stop offset="0" stop-color="#EC4899" stop-opacity=".7"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="cian"><stop offset="0" stop-color="#06B6D4" stop-opacity=".6"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <radialGradient id="amarillo"><stop offset="0" stop-color="#FACC15" stop-opacity=".45"/><stop offset="1" stop-color="#FACC15" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#fondo)"/>
